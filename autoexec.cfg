alias +SECONDARY "cl_teamid_overhead_fade_near_crosshair 0; cl_teamid_overhead_mode 3; +cl_show_team_equipment; NORM; key1; key2; key4; key5; key=; key-; keyE; keyF; keyK; keyP; keyR; keyF4; keyLA; keyDA; keyRA; keyUA; keyEND; keyPGDN; keyINS; keyHOME; keyPGUP; keyM4; keyM5; keyMdP"
alias -SECONDARY "cl_teamid_overhead_fade_near_crosshair 0.75; cl_teamid_overhead_mode 1; -cl_show_team_equipment; def1; def2; def4; def5; def=; def-; defE; defF; defK; defP; defR; defF4; defLA; defDA; defRA; defUA; defEND; defPGDN; defINS; defHOME; defPGUP; defM4; defM5; defMdP"
bind "ALT" "+SECONDARY; use_; lookatweapon_"

alias "use_" "use -999 0 0"
alias "lookatweapon_" "lookatweapon -999 0 0"

alias "+scorenet" "+showscores; cl_radar_scale .315; cl_radar_always_centered 0; cl_radar_icon_scale_min .7; cl_hud_telemetry_net_misdelivery_show 2; cl_hud_telemetry_ping_show 2; cl_showfps 1"
alias "-scorenet" "-showscores; cl_radar_scale .48; cl_radar_always_centered 1; cl_radar_icon_scale_min .5; cl_hud_telemetry_net_misdelivery_show 0; cl_hud_telemetry_ping_show 0; cl_showfps 0"
bind "TAB" "+scorenet"

alias "+dropc4" "slot5" 
alias "-dropc4" "drop"

alias NORM "cl_crosshairsize 1.19; cl_crosshairgap -1.5"
alias GUIDELINES "cl_crosshairsize 9999; cl_crosshairgap 0"

alias NORM1 "slot1; NORM"
alias NORM2 "slot2; NORM"
alias NORM5 "slot5; NORM"

alias dc "disconnect"
alias wp "exec warmup"
alias fix "exec unstuck"

exec main

bind "M" "+map_action"
bind "J" "+T_action"
bind "H" "+CT_action"

host_writeconfig